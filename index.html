<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macOnline</title>
<style>
  :root { color-scheme: dark; --s: .35; } /* size of the bars relative to the screen; change with ?size=40 */
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
         font-family: -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif; }
  /* The bars take a fraction (--s, default 35%) of the width and height of the screen, centered (full size on portrait). */
  #bars { display: flex; flex-direction: column; gap: calc(1.2vh * var(--s)); width: calc(100vw * var(--s)); height: calc(100vh * var(--s)); }
  .bar { flex: 1; display: flex; align-items: center; gap: calc(3vw * var(--s)); padding: 0 calc(3vw * var(--s)); border-radius: calc(1.6vh * var(--s));
         color: #000; font-weight: 800; background: #3a3a3c; transition: background .4s; }
  .bar.empty { opacity: .3; }
  .num { font-size: min(calc(11vh * var(--s)), calc(9vw * var(--s))); line-height: 1; min-width: 1.2ch; }
  .tag { font-size: min(calc(7vh * var(--s)), calc(5.5vw * var(--s))); font-weight: 800; min-width: 3ch; }
  .stats { font-size: min(calc(7vh * var(--s)), calc(5.5vw * var(--s))); font-weight: 700; white-space: nowrap; overflow: hidden; }
  @media (max-aspect-ratio: 1/1) {
    #bars { width: 96vw; height: 96vh; gap: 1.2vh; }
    .bar { border-radius: 1.6vh; gap: 3vw; padding: 0 3vw; }
    .num { font-size: min(11vh, 9vw); }
    .tag, .stats { font-size: min(7vh, 5.5vw); }
  }
  #updated { position: fixed; right: 2vw; bottom: .6vh; font-size: 2.2vh; color: #888; }
  /* ?theme=blend: transparent background so the page blends into the page it is embedded in. */
  html.blend { color-scheme: normal; }
  html.blend, html.blend body { background: transparent; }
  html.blend #updated { color: rgba(0, 0, 0, .45); }
  .s1 { background: #34c759; } .s0 { background: #ff3b30; } .s3 { background: #af52de; }
  .s4 { background: #0a84ff; } .s5 { background: #ff9f0a; } .s-1, .s2 { background: #8e8e93; }
</style>
</head>
<body>
<div id="bars"></div>
<div id="updated"></div>
<script>
// Shows the 5 monitored names as numbered bars with only the first 3 letters of each name,
// colored by status, with the stats published by the macOnline Mac app at api.keyval.org.
// The page reads "myonline.web" (3-letter tags + status codes) and "myonline.stats" only, so full
// names never reach this page.
const API = "https://api.keyval.org/get/";
const MAX = 5;

// Optional ?theme=blend makes the background transparent (for embedding in another page).
if (new URLSearchParams(location.search).get("theme") === "blend") document.documentElement.classList.add("blend");

// Optional ?size=NN (percent of the screen, 10-100) changes the size of the bars.
const size = Number(new URLSearchParams(location.search).get("size"));
if (size >= 10 && size <= 100) document.documentElement.style.setProperty("--s", size / 100);

const get = async key => {
  try {
    const r = await fetch(API + key, { cache: "no-store" });
    return (await r.json()).val ?? null;
  } catch { return null; }
};

function render(rows) {
  const root = document.getElementById("bars");
  root.innerHTML = "";
  for (let i = 0; i < MAX; i++) {
    const row = rows[i];
    const el = document.createElement("div");
    el.className = "bar" + (row ? " s" + row.code : " empty");
    if (row) {
      const time = row.first ? row.first.slice(0, 2) + ":" + row.first.slice(2) + " " : "";
      el.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="tag">' + row.tag + '</span>' +
        (row.stats ? '<span class="stats">' + time + "O=" + row.stats[0] + " P=" + row.stats[1] + " H=" + row.stats[2] + "</span>" : "");
    }
    root.appendChild(el);
  }
}

let last = [];
async function refresh() {
  const web = await get("myonline.web");
  if (web) {
    // Entries are "abc.<code>" (code 0 offline, 1 online, 3 private, 4 hidden, 5 away, x unknown).
    const tags = web.split(",").filter(Boolean).slice(0, MAX).map(e => e.split("."));
    const [statsRaw, seen] = await Promise.all([get("myonline.stats"), get("myonline.seen")]);
    // Entries are "HHmm.O.P.H" ("-" instead of HHmm when never online), in the order of the names.
    const entries = (statsRaw || "").split(",");
    // The Mac app stops updating "seen" when it is not running.
    const stale = seen && Date.now() / 1000 - Number(seen) > 600;
    last = tags.map(([tag, c], i) => {
      const p = (entries[i] || "").split(".");
      const ok = p.length === 4 && p.slice(1).every(x => /^\d+$/.test(x));
      return {
        tag,
        code: stale ? 2 : (c === "x" ? -1 : Number(c)),
        first: ok && /^\d{4}$/.test(p[0]) ? p[0] : "",
        stats: ok ? p.slice(1) : null,
      };
    });
    document.getElementById("updated").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  render(last);
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
